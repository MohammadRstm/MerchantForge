name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  SOLUTION: MerchForge.slnx

jobs:
  build:
    name: Restore & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MerchForge.UnitTests/MerchForge.UnitTests.csproj

      - name: Run unit tests
        run: dotnet test MerchForge.UnitTests/MerchForge.UnitTests.csproj --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.trx

  integration-tests:
    name: Integration tests (MySQL/MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MerchForge.IntegrationTests/MerchForge.IntegrationTests.csproj

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && break
            echo "Waiting for MariaDB..."
            sleep 2
          done

      - name: Run integration tests
        # CatalogDatabaseFixture connects to Server=localhost;Port=3306;User=root;Password=;
        # (see MerchForge.IntegrationTests/CatalogDatabaseFixture.cs) — the service
        # container above is configured to match that exactly. Tests gated behind
        # Xunit.SkippableFact for live AI providers (LiveAgent*/LiveEndToEnd*) skip
        # cleanly here since no AI provider secrets are configured in CI.
        run: dotnet test MerchForge.IntegrationTests/MerchForge.IntegrationTests.csproj --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/*.trx

  # Everything below runs only on a merge to main. Both CI triggers above include
  # pull_request, and a fork's pull request must never be able to push an image or
  # reach a deployment secret.
  publish:
    name: Publish image
    needs: [build, unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve the image name
        # ghcr rejects an uppercase path, and the owner login is not guaranteed to
        # be lowercase. Derived rather than hardcoded so a fork or a rename needs no
        # edit here.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/merchforge-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in token, scoped by the permissions block above. No PAT needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The api project is self-contained - its csproj has no ProjectReference -
          # so the folder is the whole build context.
          context: ./MerchForge.api
          push: true
          # :latest is what the production compose file follows; the sha tag is what
          # makes a rollback to a specific build possible without rebuilding it.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Program.cs deliberately never calls Database.Migrate(), so schema changes are
  # applied by hand against production. This keeps the script that does it always
  # available and always current, instead of someone having to reproduce a local
  # toolchain at the moment they need it. Idempotent: every statement is guarded on
  # __EFMigrationsHistory, so applying it twice is a no-op.
  migration-script:
    name: Migration script
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install the EF tools
        run: dotnet tool install --global dotnet-ef

      - name: Generate the idempotent script
        # Script generation never opens a connection - it reads the model - but the
        # DbContext still has to be constructible, so a syntactically valid string
        # has to be present. It is deliberately not a real one.
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Port=3306;Database=merchforge;User=root;Password=not-a-real-password;"
        run: dotnet ef migrations script --idempotent --project MerchForge.api --startup-project MerchForge.api -o migrate-prod.sql

      - uses: actions/upload-artifact@v4
        with:
          name: migrate-prod-sql
          path: migrate-prod.sql
          retention-days: 90
