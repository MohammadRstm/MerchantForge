name: Deploy to production

# Manual only, deliberately. Production holds live data on a host shared with about
# twenty unrelated applications, so putting a build on it is a decision somebody
# makes rather than a side effect of merging. Backend CI and Frontend CI publish
# images automatically; this is the step that moves the server onto them.
#
# There is no push trigger and no pull_request trigger here, which is also what
# guarantees no fork's pull request can ever reach the deployment credentials.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        type: string

# Never two at once, and never cancelled halfway: a partially replaced stack is
# worse than a queued run finishing.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and restart
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest

    # Add required reviewers to this environment in repository settings to put an
    # approval in front of the button itself.
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/merchforge/backend' }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Pinning the host key is what stops the runner handing its credentials to
          # whatever happens to answer on that address. Falls back to trusting the
          # first response, loudly, so a missing secret degrades rather than blocks.
          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          else
            echo "::warning title=Host key not pinned::Set the DEPLOY_HOST_KEY secret so the runner verifies which server it is talking to."
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          # IdentitiesOnly stops ssh offering any other key the runner might have.
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # The compose file is version controlled, so the checkout has to move
          # before compose reads it. --ff-only rather than a merge on purpose: a
          # server tree that has diverged is something to go and look at, not
          # something a deploy should resolve on its own.
          git pull --ff-only

          # .env.production exists only on the server - not in the repository, not in
          # a secret - so it is named explicitly rather than picked up implicitly.
          # Its :?-guarded variables are also what stops a half-configured stack from
          # starting: compose fails naming the missing one and replaces nothing.
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"

          $COMPOSE pull
          $COMPOSE up -d
          $COMPOSE ps
          REMOTE

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/id_deploy
