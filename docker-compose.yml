# Local dev/staging stack, not a production deployment topology (no hosting
# provider has been chosen yet - see the roadmap's Phase 9). Brings up MySQL,
# runs migrations as an explicit one-off step (never automatic on the API
# container's own startup - see MerchForge.api/Dockerfile's "migrator" stage),
# then the API and dashboard frontend. Mailpit catches every outbound email
# locally (invitation links included) instead of needing real SMTP
# credentials just to try the app - open http://localhost:8025 to read them.
#
# The frontend's build context reaches across into the sibling MerchForgeClient
# checkout - this assumes the two repos are cloned side by side under the same
# parent directory, which is how this project's local setup already works.
# A real deployment would instead build/push the frontend as its own image
# from its own repo's CI, not build it from here.
#
# Secrets/config come from a .env file next to this one - copy .env.example to
# .env and fill it in before running `docker compose up`.

services:
  mysql:
    image: mariadb:10.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: merchforge
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI - read captured emails, including invitation links, here
      - "1025:1025" # SMTP

  # Applies pending EF Core migrations, then exits. Not a long-running
  # service - "api" waits for this to finish successfully before starting.
  migrate:
    build:
      context: ./MerchForge.api
      target: migrator
    environment:
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=merchforge;User=root;Password=${DB_ROOT_PASSWORD};"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: ./MerchForge.api
      target: runtime
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=merchforge;User=root;Password=${DB_ROOT_PASSWORD};"
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: MerchForge
      Jwt__Audience: MerchForge.Client
      Jwt__AccessTokenExpirationMinutes: 15
      Jwt__Customer__Audience: MerchForge.Customer
      Jwt__Customer__AccessTokenExpirationMinutes: 15
      Email__Host: mailpit
      Email__Port: 1025
      Email__Username: ""
      Email__Password: ""
      Email__FromEmail: noreply@merchforge.local
      Email__FromName: MerchForge
      Frontend__BaseUrl: http://localhost:8081
      Cors__AllowedOrigins__0: http://localhost:8081
      # This stack is plain HTTP end to end (no reverse proxy/TLS termination
      # in front of it) - a Secure cookie is silently dropped by the browser
      # over HTTP, which would break login entirely. A real deployment sits
      # behind HTTPS and must NOT set these to false.
      RefreshToken__Secure: "false"
      CustomerRefreshToken__Secure: "false"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ../../../Desktop/MerchForgeClient
      args:
        VITE_SERVER_URL_DEV: http://localhost:8080/
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  mysql-data:
