name: Deploy to production

# Manual only, deliberately. Production holds live data on a host shared with about
# twenty unrelated applications, so putting a build on it is a decision somebody
# makes rather than a side effect of merging.
#
# There is no push trigger and no pull_request trigger here, which is also what
# guarantees no fork's pull request can ever reach the deployment credentials.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        type: string

# Never two at once, and never cancelled halfway: a partially replaced stack, or a
# migration interrupted mid-run, is worse than a queued run finishing.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Generated from the commit being deployed, in this run, rather than fetched from
  # an earlier one - so the schema change applied can never belong to a different
  # build than the image that follows it.
  script:
    name: Migration script
    if: inputs.confirm == 'deploy'
    uses: ./.github/workflows/migration-script.yml

  deploy:
    name: Migrate and restart
    needs: script
    runs-on: ubuntu-latest

    # Add required reviewers to this environment in repository settings to put an
    # approval in front of the button itself.
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: migrate-prod-sql

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/root/merchforge/backend' }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          # Pinning the host key is what stops the runner handing its credentials to
          # whatever happens to answer on that address. Falls back to trusting the
          # first response, loudly, so a missing secret degrades rather than blocks.
          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            printf '%s\n' "$DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
          else
            echo "::warning title=Host key not pinned::Set the DEPLOY_HOST_KEY secret so the runner verifies which server it is talking to."
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

          # IdentitiesOnly stops ssh offering any other key the runner might have.
          SSH_OPTS="-i $HOME/.ssh/id_deploy -o IdentitiesOnly=yes"

          # Sent ahead rather than piped, because the remote script itself arrives on
          # stdin.
          scp $SSH_OPTS -P "$DEPLOY_PORT" migrate-prod.sql \
              "$DEPLOY_USER@$DEPLOY_HOST:/tmp/migrate-prod.sql"

          ssh $SSH_OPTS -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # The compose file is version controlled, so the checkout has to move
          # before compose reads it. --ff-only rather than a merge on purpose: a
          # server tree that has diverged is something to go and look at, not
          # something a deploy should resolve on its own.
          git pull --ff-only

          # .env.production exists only on the server - not in the repository, not in
          # a secret - so it is named explicitly rather than picked up implicitly.
          # Its :?-guarded variables are also what stops a half-configured stack from
          # starting: compose fails naming the missing one and replaces nothing.
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env.production"

          # ---- back up before touching the schema ----
          #
          # scripts/backup-db.sh is the mechanism docs/backup-and-recovery.md already
          # describes, and DB_CONTAINER is what lets it reach a database publishing no
          # port to its host. Calling it rather than repeating a mysqldump here keeps
          # one way of taking a backup - which matters mostly because it is the shape
          # scripts/restore-db.sh knows how to read back. The script refuses to report
          # success on an empty dump, so a deploy cannot proceed on a worthless one.
          DB_CONTAINER=merchforge-db-prod scripts/backup-db.sh backups

          # Retention is policy, and that script says of itself that it is the
          # mechanism and not the schedule. Ten is enough to reach back past a bad
          # deploy without the directory growing without limit.
          ls -1t backups/merchforge-*.sql | tail -n +11 | xargs -r rm --

          # ---- apply the schema change ----
          #
          # Before the new image, because the new code is what expects the new
          # schema. The script is idempotent, so a deploy with nothing pending
          # applies nothing. set -e means a failure here stops the run with the old
          # stack still serving and a fresh backup on disk.
          docker exec -i merchforge-db-prod sh -c \
            'MYSQL_PWD="$MARIADB_ROOT_PASSWORD" mysql -uroot merchforge' < /tmp/migrate-prod.sql
          rm -f /tmp/migrate-prod.sql
          echo "Migrations applied."

          # ---- and only then the new build ----
          $COMPOSE pull
          $COMPOSE up -d
          $COMPOSE ps
          REMOTE

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/id_deploy
