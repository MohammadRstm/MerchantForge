# Runs the containerized stack the way it's meant to run on a real host: api,
# frontend (nginx), and db together, only nginx's port published outward.
#
# Deliberately references pre-built images, not `build:` contexts -- the frontend
# image comes from a sibling repo (MerchForgeClient) with no fixed path relationship
# to this one, and a real deployment host won't have both repos checked out at all.
# Build each image once in its own repo (see each repo's Dockerfile), tag it to
# match below, and this file just runs whatever is tagged that name -- a local
# build today, or a registry pull later, with no change to this file either way.
#
# This is a separate Compose project from docker-compose.yml (dev DB): independent
# network, independent volumes, can run alongside it with no collision.
#
# Copy .env.production.example to .env.production, fill in real values (never
# commit that file), then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production pull
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# The images come from ghcr, published by each repository's own CI on a merge to
# main, so a deployment pulls a build rather than making one - a host running other
# people's production containers is a bad place to compile. Both are overridable:
# set API_IMAGE or FRONTEND_IMAGE to pin a specific :sha tag for a rollback, or to
# a locally built tag to run something that was never pushed.
#
# name: below pins this to its own Compose project ("merchforge-prod") regardless
# of which directory it's run from. Without it, Compose derives the project name
# from the current folder -- the same folder docker-compose.yml (dev) lives in --
# so running this file here would fold both stacks into one implicit project.
# Compose matches existing containers to services by (project, service name), not
# by container_name, so a same-named "db" service in both files under one shared
# project makes `up` treat them as the same slot and *replace* whichever container
# is currently there, no matter which container_name each file gives it. Learned
# this by triggering it: running this file recreated dev's live merchforge-db
# container into merchforge-db-prod mid-session. The pinned name below closes
# that off structurally, on top of already using distinct container/volume names.
name: merchforge-prod

services:
  db:
    image: mariadb:10.4
    container_name: merchforge-db-prod
    restart: unless-stopped
    # Same reasoning as docker-compose.yml's dev db: set once at first init, kept
    # consistent across environments so a dump/restore between them never hits the
    # Hangfire table-casing collision fixed there.
    command: ["--lower-case-table-names=1"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: merchforge
    volumes:
      - merchforge_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Deliberately conservative, and deliberately present at all.
    #
    # This host is shared: 26 containers across a dozen unrelated applications on
    # two cores. Most of the other tenants are already capped (200-600 MiB); this
    # stack shipped with no limits, which made it the one thing on the box that
    # *could* have taken the whole machine - and that is exactly what it was
    # accused of during the September outage, on a CPU figure that turned out to
    # be hypervisor steal. Limits make that accusation impossible to level again,
    # because the ceiling is enforced rather than argued.
    #
    # The three caps below total 1.5 of the 2 available cores, so the stack cannot
    # starve its neighbours even if every container saturates at once. They are set
    # against measured idle usage (db 96 MiB / 0.35%, api 202 MiB / 1%, frontend
    # 3.7 MiB / 0%) with real headroom on top, not against guesses. Raise them once
    # the host's steal problem is settled - see docs, and check `docker stats`
    # after a deploy: the LIMIT column should show these values, not the host total.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 192M

  api:
    image: ${API_IMAGE:-ghcr.io/mohammadrstm/merchforge-api:latest}
    container_name: merchforge-api-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=merchforge;User=root;Password=${DB_ROOT_PASSWORD};"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      Email__Host: ${EMAIL_HOST}
      Email__Port: ${EMAIL_PORT:-587}
      Email__Username: ${EMAIL_USERNAME}
      Email__Password: ${EMAIL_PASSWORD}
      Email__FromEmail: ${EMAIL_FROM}
      Email__FromName: MerchForge
      Frontend__BaseUrl: ${PUBLIC_BASE_URL}
      Cors__AllowedOrigins__0: ${PUBLIC_BASE_URL}
      Ai__ApiKey: ${OPENAI_API_KEY:-}
      GeminiFlash__ApiKey: ${GEMINI_API_KEY:-}
      # Cloudflare R2, where product images and template previews live. Unlike the
      # AI keys these are not optional: R2Options validates on start, so the api
      # container refuses to boot with any of them missing rather than failing on
      # the first upload. R2_PUBLIC_BASE_URL is the anonymous read origin the
      # browser loads images from - a different URL from R2_ENDPOINT, which is the
      # authenticated S3 API and never reaches a browser.
      R2__AccountId: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is required}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      R2__BucketName: ${R2_BUCKET_NAME:?R2_BUCKET_NAME is required}
      R2__Endpoint: ${R2_ENDPOINT:?R2_ENDPOINT is required}
      R2__PublicBaseUrl: ${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL is required}
    volumes:
      - merchforge_api_wwwroot:/app/wwwroot
    # See the note on the db service. 768M rather than the db's 512M because the
    # .NET GC sizes its heap against what it believes is available - measured
    # steady state was 202 MiB, so this is roughly 3.5x headroom rather than a
    # ceiling the app is expected to run near.
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          memory: 256M

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/mohammadrstm/merchforge-frontend:latest}
    container_name: merchforge-frontend-prod
    restart: unless-stopped
    depends_on:
      - api
    # Bound to loopback, not every interface. "8080:80" published this container on
    # the host's public address too, so http://<server-ip>:8080 reached the app
    # directly - bypassing Cloudflare (and therefore Bot Fight Mode and the DDoS
    # edge), bypassing TLS, and bypassing the host vhost that terminates it. Docker
    # writes its own iptables rules ahead of UFW, so a host firewall does not
    # necessarily close that door either.
    #
    # The host's nginx proxies to http://localhost:8080, so loopback is all it has
    # ever needed. This changes nothing about how the site is served and removes the
    # only route into the stack that skipped every protection in front of it.
    ports:
      - "127.0.0.1:8080:80"
    # nginx serving static files and proxying /api/. Measured at 3.7 MiB and a flat
    # 0.00% CPU in every sample taken during the outage window, so this is a large
    # multiple of anything it has ever used - it exists to bound the worst case
    # (a request flood arriving at the edge), not to constrain normal operation.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 32M

volumes:
  merchforge_mysql_prod_data:
  merchforge_api_wwwroot:
