name: Migration script

# Reusable, called from two places for two reasons: Backend CI runs it on every
# merge so the pending schema change is visible as an artifact before anyone
# decides to deploy, and Deploy runs it so the script it applies is generated from
# the very commit being deployed rather than fetched from some earlier run.
on:
  workflow_call:

# A reusable workflow does not inherit the caller's env, so these are repeated
# rather than shared.
env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  SOLUTION: MerchForge.slnx

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest

    # Generating a script reads the model and never touches a database - but
    # Program.cs registers the context with ServerVersion.AutoDetect, which opens a
    # connection while the options are being built. So a server has to be reachable
    # for the context to be discovered at all. Same image and settings as the
    # integration-tests job, which needs one for the honest reason.
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          # Named because the connection string below carries a database and
          # AutoDetect fails on an unknown one. Nothing is ever written to it.
          MARIADB_DATABASE: merchforge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # dotnet ef builds the project to read its model, and a build needs the
      # assets file restore produces.
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Install the EF tools
        run: dotnet tool install --global dotnet-ef

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && break
            echo "Waiting for MariaDB..."
            sleep 2
          done

      # --idempotent guards every statement on __EFMigrationsHistory, so applying
      # the script twice is a no-op. That is what makes it safe to run on every
      # deploy rather than only when something is known to be pending.
      - name: Generate the idempotent script
        env:
          ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=merchforge;User=root;Password=;"
        run: dotnet ef migrations script --idempotent --project MerchForge.api --startup-project MerchForge.api -o migrate-prod.sql

      - name: Show what it would change
        run: |
          echo "Statements: $(grep -ci '^\s*\(CREATE\|ALTER\|DROP\|INSERT\|UPDATE\)' migrate-prod.sql || true)"
          echo "::group::migrate-prod.sql"
          cat migrate-prod.sql
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        with:
          name: migrate-prod-sql
          path: migrate-prod.sql
          retention-days: 90
